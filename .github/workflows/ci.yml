name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, contracts, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uniacmis
          POSTGRES_USER: uniacmis
          POSTGRES_PASSWORD: uniacmis
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tests pin their own settings via --ds in pyproject.toml; this is for the
      # management commands below.
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "True"
      DATABASE_URL: postgres://uniacmis:uniacmis@localhost:5432/uniacmis
      REDIS_URL: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Module boundary contracts
        # Fails the build on a cross-app model import. Without this, the
        # "loosely coupled modules" principle decays into a suggestion.
        run: lint-imports

      - name: Migration drift
        # A model change without its migration fails here rather than at deploy.
        run: python manage.py makemigrations --check --dry-run

      - name: Django checks (production settings)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-production-check-secret-value
          DEBUG: "False"
          ALLOWED_HOSTS: campus.example.ss
          ENABLE_DEMO_HOLD_PROVIDER: "False"
          SECURE_SSL_REDIRECT: "False"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Verify the seeding path
        # seed_roles runs on every deploy, so a break in it is a deploy-blocker.
        run: |
          python manage.py migrate
          python manage.py seed_roles
          python manage.py seed_roles  # must be idempotent
          python manage.py permission_matrix --check-separation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
